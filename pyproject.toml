[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bandas-df"
version = "0.4.1"
description = "Bandas: pandas-compatible DataFrames at full speed - SQL, time series, preprocessing, ML/DL, visualization"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "salim-studio" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Database",
]
# Single-command install: pip install bandas-df
# (torch/tensorflow stay optional under [dl]: multi-GB size, no wheels for newest Pythons)
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "numba>=0.57",
  "pyarrow>=12",
  "sqlalchemy>=2.0",
  "duckdb>=0.9",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "openpyxl>=3.1",
  "xlrd>=2.0",
]
keywords = ["dataframe", "pandas", "fast", "numpy", "sql", "database", "machine-learning", "deep-learning", "data-science", "analytics", "time-series", "preprocessing"]

[project.urls]
Homepage = "https://github.com/salim-studio/bandas"
Repository = "https://github.com/salim-studio/bandas"
Documentation = "https://github.com/salim-studio/bandas#readme"
Changelog = "https://github.com/salim-studio/bandas/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/salim-studio/bandas/issues"

[project.optional-dependencies]
speed = ["numba>=0.57", "pyarrow>=12"]
db = ["sqlalchemy>=2.0", "duckdb>=0.9"]
ml = ["scikit-learn>=1.3", "scipy>=1.10"]
dl = ["torch>=2.0", "tensorflow>=2.14"]
viz = ["matplotlib>=3.7", "seaborn>=0.12"]
excel = ["openpyxl>=3.1", "xlrd>=2.0"]
all = ["numba>=0.57", "pyarrow>=12", "pytest", "sqlalchemy>=2.0", "duckdb>=0.9", "scikit-learn>=1.3", "scipy>=1.10", "matplotlib>=3.7", "openpyxl>=3.1"]

[tool.setuptools.packages.find]
include = ["bandas*"]
